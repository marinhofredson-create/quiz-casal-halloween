name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v1.3 game assets
        run: |
          mkdir -p app/src/main/assets
          cat payload_v13/index.part* > app/src/main/assets/index.html
          base64 -d payload_v12/home.b64 > /tmp/home-source.jpg
          base64 -d payload_v12/couple.b64 > /tmp/couple-source.jpg
          if command -v convert >/dev/null 2>&1; then
            convert /tmp/home-source.jpg -filter Lanczos -resize '960x540^' -gravity center -extent 960x540 -quality 94 app/src/main/assets/home.jpg
            convert /tmp/couple-source.jpg -filter Lanczos -resize '480x552^' -gravity center -extent 480x552 -quality 94 app/src/main/assets/couple.jpg
          else
            cp /tmp/home-source.jpg app/src/main/assets/home.jpg
            cp /tmp/couple-source.jpg app/src/main/assets/couple.jpg
          fi
          echo "Assets v1.3 reconstruidos:"
          wc -c app/src/main/assets/index.html app/src/main/assets/home.jpg app/src/main/assets/couple.jpg

      - name: Pre-test v1.3 interface
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/home.jpg
          test -s app/src/main/assets/couple.jpg
          grep -q 'id="playBtn"' app/src/main/assets/index.html
          grep -q 'id="howBtn"' app/src/main/assets/index.html
          grep -q 'id="scoreBtn"' app/src/main/assets/index.html
          grep -q 'id="settingsBtn"' app/src/main/assets/index.html
          grep -q 'id="roundsBtn"' app/src/main/assets/index.html
          grep -q 'id="nextBtn"' app/src/main/assets/index.html
          grep -q 'id="hitBtn"' app/src/main/assets/index.html
          grep -q 'id="missBtn"' app/src/main/assets/index.html
          grep -q 'function startGame' app/src/main/assets/index.html
          grep -q 'function nextQuestion' app/src/main/assets/index.html
          grep -q 'function startAudio' app/src/main/assets/index.html
          grep -q 'function runSelfTest' app/src/main/assets/index.html
          ! grep -q 'playHot' app/src/main/assets/index.html
          echo 'Pre-teste estrutural v1.3: OK'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK v1.3
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizCasalHalloween-v1.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

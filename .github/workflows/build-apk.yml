name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v1.4 game assets
        run: |
          mkdir -p app/src/main/assets
          cat payload_v13/index.part* > app/src/main/assets/index.html
          base64 -d payload_v12/home.b64 > app/src/main/assets/home.jpg
          base64 -d payload_v12/couple.b64 > app/src/main/assets/couple.jpg
          echo "Assets v1.4 reconstruidos:"
          wc -c app/src/main/assets/index.html app/src/main/assets/home.jpg app/src/main/assets/couple.jpg

      - name: Pre-test v1.4 interface
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/home.jpg
          test -s app/src/main/assets/couple.jpg
          grep -q 'id="playBtn"' app/src/main/assets/index.html
          grep -q 'id="howBtn"' app/src/main/assets/index.html
          grep -q 'id="scoreBtn"' app/src/main/assets/index.html
          grep -q 'id="settingsBtn"' app/src/main/assets/index.html
          grep -q 'id="roundsBtn"' app/src/main/assets/index.html
          grep -q 'id="nextBtn"' app/src/main/assets/index.html
          grep -q 'id="hitBtn"' app/src/main/assets/index.html
          grep -q 'id="missBtn"' app/src/main/assets/index.html
          grep -q 'function startGame' app/src/main/assets/index.html
          grep -q 'function nextQuestion' app/src/main/assets/index.html
          grep -q 'function startAudio' app/src/main/assets/index.html
          ! grep -q 'playHot' app/src/main/assets/index.html
          echo 'Pre-teste estrutural v1.4: OK'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean debug APK v1.4
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Validate APK package, launcher and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.fredirene.quizcasalhalloween.v14'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.fredirene.quizcasalhalloween.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          echo 'APK v1.4: package, launcher, assinatura e ZIP OK'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizCasalHalloween-v1.4-clean-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

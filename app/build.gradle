plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fredirene.quizcasalhalloween'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fredirene.quizcasalhalloween.v15'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
